<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sway Music — Панель управления</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/art/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/admin/app.js"></script>
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <img src="/art/logo.svg" alt="Sway" class="auth-logo" width="54" height="54">
      <h2 class="auth-title">Sway Admin</h2>
      <p class="auth-desc" id="auth-subtitle">Вход в панель управления проектом</p>
      <form id="auth-form">
        <div class="form-group" style="text-align:left">
          <input type="password" id="auth-password" class="form-input" placeholder="Пароль администратора" required autocomplete="current-password" autofocus>
        </div>
        <button type="submit" class="btn primary block" style="margin-top:12px">Войти в панель</button>
      </form>
      <p class="auth-hint" id="auth-tg-hint">
        Также можно войти через Telegram-бота командой <code>/login</code>.
      </p>
    </div>
  </div>

  <!-- Shell -->
  <div id="admin-shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/art/logo.svg" alt="Sway" width="34" height="34">
        <div>
          <div class="brand-name">Sway Admin</div>
          <div class="brand-sub">Панель управления</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Разделы панели">
        <div class="nav-label">Проект</div>
        <button class="nav-item active" type="button" data-view="overview"><span class="nav-ico">◈</span><span>Обзор</span></button>
        <button class="nav-item" type="button" data-view="catalog"><span class="nav-ico">♪</span><span>Каталог</span><span class="nav-badge" id="badge-catalog"></span></button>
        <button class="nav-item" type="button" data-view="lyrics"><span class="nav-ico">✎</span><span>Тексты и караоке</span></button>

        <div class="nav-label">Контент</div>
        <button class="nav-item" type="button" data-view="content"><span class="nav-ico">✦</span><span>Промо и рассылки</span></button>
        <button class="nav-item" type="button" data-view="analytics"><span class="nav-ico">◔</span><span>Аналитика</span></button>

        <div class="nav-label">Люди</div>
        <button class="nav-item" type="button" data-view="users"><span class="nav-ico">☺</span><span>Пользователи</span></button>

        <div class="nav-label">Система</div>
        <button class="nav-item" type="button" data-view="settings"><span class="nav-ico">⚙</span><span>Настройки</span></button>
      </nav>

      <div class="sidebar-foot">
        <div id="sidebar-status">Sway Music · Admin</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="btn icon menu-btn" id="menu-btn" aria-label="Меню">☰</button>
        <div>
          <div class="crumb" id="view-crumb">Sway Music</div>
          <h1 id="view-title">Обзор</h1>
        </div>
        <div class="topbar-actions">
          <a href="/" target="_blank" rel="noopener" class="btn sm">🎵 <span class="hide-sm">Открыть плеер</span></a>
          <button type="button" id="logout-btn" class="btn sm danger">Выйти</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

</body>
</html>
