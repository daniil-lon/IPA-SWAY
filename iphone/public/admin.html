<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sway Music — Панель управления</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/art/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/admin.css">
  <link rel="stylesheet" href="/admin-ios.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="module" src="/admin/app.js"></script>
</head>
<body>

  <!-- Auth screen -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <img src="/art/logo.svg" alt="Sway" class="auth-logo" width="54" height="54">
      <h2 class="auth-title">Sway Admin</h2>
      <p class="auth-desc" id="auth-subtitle">Вход в панель управления проектом</p>
      <form id="auth-form">
        <div class="form-group" style="text-align:left">
          <input type="password" id="auth-password" class="form-input" placeholder="Пароль администратора" required autocomplete="current-password" autofocus>
        </div>
        <button type="submit" class="btn primary block" style="margin-top:12px">Войти в панель</button>
      </form>
      <p class="auth-hint" id="auth-tg-hint">
        Также можно войти через Telegram-бота командой <code>/login</code>.
      </p>
    </div>
  </div>

  <!-- Shell -->
  <div id="admin-shell" class="shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/art/logo.svg" alt="Sway" width="34" height="34">
        <div>
          <div class="brand-name">Sway Admin</div>
          <div class="brand-sub">Панель управления</div>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Разделы панели">
        <div class="nav-label">Проект</div>
        <button class="nav-item active" type="button" data-view="overview"><span class="nav-ico" style="--ia:#5b8cff;--ib:#7c5cff"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="2.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="3.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="3.5"/><path d="M17 13.5v7M13.5 17h7"/></svg></span><span>Обзор</span></button>
        <button class="nav-item" type="button" data-view="catalog"><span class="nav-ico" style="--ia:#ff2a85;--ib:#ff6a3d"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3.5a8.5 8.5 0 0 1 8.5 8.5"/></svg></span><span>Каталог</span><span class="nav-badge" id="badge-catalog"></span></button>
        <button class="nav-item" type="button" data-view="lyrics"><span class="nav-ico" style="--ia:#ffb020;--ib:#ff7a1a"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></span><span>Тексты и караоке</span></button>

        <div class="nav-label">Контент</div>
        <button class="nav-item" type="button" data-view="content"><span class="nav-ico" style="--ia:#ff4d6d;--ib:#c026d3"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4a1 1 0 0 0 1 1h2l6 4V5L7 9H5a1 1 0 0 0-1 1Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></span><span>Промо и рассылки</span></button>
        <button class="nav-item" type="button" data-view="analytics"><span class="nav-ico" style="--ia:#22c55e;--ib:#0ea5a4"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg></span><span>Аналитика</span></button>

        <div class="nav-label">Люди</div>
        <button class="nav-item" type="button" data-view="listeners"><span class="nav-ico" style="--ia:#3ee0c5;--ib:#3b82f6"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4.5" height="6.5" rx="2"/><rect x="16" y="14" width="4.5" height="6.5" rx="2"/></svg></span><span>Слушатели</span></button>
        <button class="nav-item" type="button" data-view="users"><span class="nav-ico" style="--ia:#a78bfa;--ib:#6366f1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.2A5 5 0 0 1 21.5 19"/></svg></span><span>Пользователи</span></button>

        <div class="nav-label">Система</div>
        <button class="nav-item" type="button" data-view="settings"><span class="nav-ico" style="--ia:#8e8e98;--ib:#5a5a66"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.3"/><circle cx="9" cy="17" r="2.3"/></svg></span><span>Настройки</span></button>
      </nav>

      <div class="sidebar-foot">
        <div id="sidebar-status">Sway Music · Admin</div>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button type="button" class="btn icon menu-btn" id="menu-btn" aria-label="Меню"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
        <div>
          <div class="crumb" id="view-crumb">Sway Music</div>
          <h1 id="view-title">Обзор</h1>
        </div>
        <div class="topbar-actions">
          <a href="/" target="_blank" rel="noopener" class="btn sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg> <span class="hide-sm">Открыть плеер</span></a>
          <button type="button" id="logout-btn" class="btn sm danger">Выйти</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

</body>
</html>
