<body data-auth-gate="loading">
<div id="sway-splash" class="sway-splash" aria-live="polite" role="status">
  <div class="splash-ambient"></div>
  <div class="splash-logo-wrap">
    <picture>
      <source data-sway-srcset="/art/logo-burst.webp" type="image/webp">
      <img data-sway-src="/art/logo-burst.png" alt="Sway" class="splash-logo" width="190" height="190" loading="eager" decoding="async">
    </picture>
  </div>
  <div class="splash-text">
    <div class="splash-title">SWAY</div>
    <div class="splash-sub">Загружаем музыку…</div>
    <div class="splash-progress" aria-hidden="true"><i></i></div>
  </div>
</div>
<div id="layout">
<aside class="sidebar">
  <a class="brand" href="#home"><img data-sway-src="/art/logo.svg" alt=""><span>Sway<span class="brand-dot">.</span></span></a>
  <div class="sidebar-body">
    <span class="nav-caption">СЛУШАТЬ</span>
    <nav class="nav" aria-label="Разделы">
      <a href="#home" data-nav="home"><i data-icon="home"></i><span>Главная</span></a>
      <a href="#discover" data-nav="discover"><i data-icon="music"></i><span>Что послушать</span></a>
      <a href="#search" data-nav="search"><i data-icon="search"></i><span>Поиск</span></a>
      <a href="#library" data-nav="library"><i data-icon="library"></i><span>Коллекция</span></a>
    </nav>
    <span class="nav-caption second">ВАША МУЗЫКА</span>
    <nav class="nav"><a href="#liked" data-nav="liked"><i data-icon="heart"></i><span>Мне нравится</span></a></nav>
  </div>
  <div class="sidebar-bottom">
    <a href="#settings"><i data-icon="settings"></i>Настройки</a>
  </div>
</aside>
<div class="workspace">
<header class="topbar">
  <a class="brand mobile-brand" href="#home"><img data-sway-src="/art/logo.svg" alt=""><span>Sway<span class="brand-dot">.</span></span></a>
  <a class="top-search" href="#search"><i data-icon="search"></i><span>Найти трек или артиста</span><kbd>/</kbd></a>
  <div class="top-right"><button class="install icon" id="install" aria-label="Установить приложение" hidden><i data-icon="download"></i></button><a class="account" href="#profile"><span class="avatar"><i data-icon="user"></i></span><span id="account-label">Войти</span></a></div>
</header>
<main id="main" tabindex="-1" aria-live="off">
  <div class="sway-loader-inline">
    <div class="splash-ambient"></div>
    <div class="splash-logo-wrap">
      <picture>
        <source data-sway-srcset="/art/logo-burst.webp" type="image/webp">
        <img data-sway-src="/art/logo-burst.png" alt="Sway" class="splash-logo" width="140" height="140">
      </picture>
    </div>
    <div class="splash-text">
      <div class="splash-title">SWAY</div>
      <div class="splash-sub">Загружаем музыку…</div>
    </div>
  </div>
</main>
</div>
</div>
<aside class="player glass" aria-label="Плеер">
  <div class="now"><button class="now-cover icon" id="now-open" aria-label="Открыть плеер"><img id="now-art" data-sway-src="/art/logo.svg" alt=""></button><button type="button" class="now-text" data-action="now-open" aria-label="Развернуть плеер"><strong id="now-title">Sway</strong><span id="now-artist">Выберите трек</span></button><button id="like-now" class="icon now-like" aria-label="Добавить в понравившиеся" disabled><i data-icon="heart"></i></button></div>
  <div class="transport">
    <div class="controls">
      <button class="icon extra" id="shuffle" aria-pressed="false" aria-label="Перемешать"><i data-icon="shuffle"></i></button>
      <button class="icon skip" id="prev" aria-label="Предыдущий трек"><i data-icon="prev"></i></button>
      <button class="icon toggle" id="toggle" aria-label="Воспроизвести"><i data-icon="play"></i></button>
      <button class="icon skip" id="next" aria-label="Следующий трек"><i data-icon="next"></i></button>
      <button class="icon extra" id="repeat" aria-pressed="false" aria-label="Повторять трек"><i data-icon="repeat"></i></button>
    </div>
    <div class="timeline"><span id="elapsed">0:00</span><progress id="progress" max="100" value="0"></progress><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка" disabled><span id="duration">–:––</span></div>
  </div>
  <div class="player-side">
    <button class="icon" id="queue-open" aria-label="Очередь воспроизведения"><i data-icon="queue"></i></button>
    <button class="icon" id="mute" aria-label="Выключить звук" aria-pressed="false"><i data-icon="volume"></i></button>
    <input id="volume" type="range" min="0" max="100" aria-label="Громкость" value="80">
  </div>
</aside>
<nav class="mobile-nav glass" aria-label="Разделы на телефоне">
  <a href="#home" data-nav="home"><i data-icon="wave-mark"></i>Главная</a>
  <a href="#discover" data-nav="discover"><i data-icon="music"></i>Что послушать</a>
  <a href="#library" data-nav="library"><i data-icon="personal"></i>Коллекция</a>
</nav>
<dialog id="dialog" class="glass" data-view="full" aria-label="Плеер"><div id="dialog-body"></div><button type="button" class="icon dialog-close" autofocus aria-label="Закрыть"><i data-icon="chevron"></i></button></dialog>
<dialog id="sheet" class="glass" aria-label="Действия"><div class="sheet-top" data-drag-sheet><span aria-hidden="true"></span><button type="button" class="icon dialog-close" autofocus aria-label="Закрыть"><i data-icon="close"></i></button></div><div id="sheet-body"></div><p class="sheet-notice" role="status"></p></dialog>
<dialog id="profile-editor" aria-labelledby="profile-edit-title"></dialog>
<div id="notice" role="status"></div>
<audio id="audio" crossorigin="anonymous" preload="metadata"></audio>
<audio id="audio-next" crossorigin="anonymous" preload="none"></audio>
<noscript>Для работы плеера включите JavaScript.</noscript>
</body>
</html>
